# Blueprint de Render: servidor de la tienda (pedidos, admin, correos, inventario) + base de datos Postgres gratis.
services:
  - type: web
    name: am-laminado-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: am-laminado-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "573008918966"
      - key: SHIPPING_MODE
        value: convenir
      - key: STATUS_EMAILS
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://am-laminado18k.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: PUBLIC_URL
        sync: false

databases:
  - name: am-laminado-db
    plan: free
    databaseName: am_laminado
    user: am_laminado
